# Static checks only - no cluster is booted in CI.
# Booting Kubeflow on a hosted runner is possible but takes ~40 minutes and
# flakes; if you want that, run it nightly on a self-hosted runner instead.
name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            -x -S warning scripts/*.sh tools/entrypoint.sh labs/*/verify.sh

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: |
          pipx install yamllint
          yamllint -c .yamllint.yml kind/ manifests/ labs/ .github/

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install kfp
      - name: compile the lab pipeline
        run: python3 labs/02-argo-underneath/pipeline.py --compile
